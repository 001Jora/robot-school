<svg
        class="hero-robot"
        viewBox="0 0 240 200"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="robot-title"
      >
        <title id="robot-title">A friendly blue robot</title>

        <!-- Антенна -->
        <path
          d="M120 40 V20"
          stroke="#234bc4"
          stroke-width="8"
        />
        <circle cx="120" cy="16" r="10" fill="#f59e0b"/>

        <!-- Уши -->
        <rect
          x="25" y="75" width="25" height="50"
          rx="8" fill="#234bc4"
        />
        <rect
          x="190" y="75" width="25" height="50"
          rx="8" fill="#234bc4"
        />

        <!-- Голова -->
        <rect
          x="45" y="40" width="150" height="125"
          rx="30" fill="#234bc4"
        />

        <!-- Экран лица -->
        <rect
          x="60" y="55" width="120" height="95"
          rx="20" fill="#e5edff"
        />

        <!-- Глаза -->
        <circle cx="92" cy="92" r="12" fill="#17233b"/>
        <circle cx="148" cy="92" r="12" fill="#17233b"/>

        <!-- Улыбка -->
        <path
          d="M95 120 Q120 142 145 120"
          fill="none"
          stroke="#17233b"
          stroke-width="6"
          stroke-linecap="round"
        />

        <!-- Основание -->
        <rect
          x="95" y="165" width="50" height="15"
          rx="5" fill="#f59e0b"
        />
    </svg>